name: APK Derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.5
          cache: true

      # Repoda olmayan Android dosyalarını (gradle, ikonlar vb.) üretir; mevcut dosyalara dokunmaz.
      - run: flutter create --platforms=android --org com.kerem --project-name gunluk .
      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: gunluk-apk
          path: build/app/outputs/flutter-apk/app-release.apk
